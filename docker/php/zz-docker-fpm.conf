; PHP-FPM debe ver variables de entorno de Docker (REDIS_HOST, etc.)
[www]
clear_env = no

; Pool sizing — caja 2 vCPU / 3.8GB.
; Default de la imagen oficial es max_children=5, insuficiente:
; los requests hacían cola en FPM (18s de queueing en el waterfall)
; con el server al 85% idle.
pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500

; Diagnóstico: curl --unix-socket ... /fpm-status  → mirar "listen queue"
pm.status_path = /fpm-status