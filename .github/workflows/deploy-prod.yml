name: Deploy PROD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "deploy" para confirmar (solo deploy manual)'
        required: true
        type: string
      git_branch:
        description: 'Rama a desplegar en PROD'
        required: false
        default: 'main'
        type: string
      composer_clean:
        description: 'Borrar vendor/ antes de composer install (upgrades Laravel)'
        required: false
        default: false
        type: boolean
      run_migrations:
        description: 'Ejecutar migrate --force'
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      quick: true
      phpstan_base: ${{ github.event.before }}

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="/var/www/html/intranet_back"; fi

            GIT_BRANCH="${{ github.event.inputs.git_branch }}"
            if [ -z "$GIT_BRANCH" ]; then GIT_BRANCH="main"; fi

            DEPLOY_MODE="${{ vars.PROD_DEPLOY_MODE }}"
            if [ -z "$DEPLOY_MODE" ]; then DEPLOY_MODE="docker"; fi

            COMPOSER_CLEAN="false"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.composer_clean }}" = "true" ]; then
              COMPOSER_CLEAN="true"
            elif [ "${{ vars.PROD_COMPOSER_CLEAN }}" = "true" ]; then
              COMPOSER_CLEAN="true"
            fi

            RUN_MIGRATIONS="true"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.run_migrations }}" = "false" ]; then
              RUN_MIGRATIONS="false"
            fi

            export DEPLOY_PATH
            export GIT_BRANCH
            export DEPLOY_MODE
            export COMPOSER_CLEAN
            export RUN_MIGRATIONS

            sudo git config --global --add safe.directory "${DEPLOY_PATH}" || true
            sudo git config --global --add safe.directory '*' || true

            echo "[deploy-prod] path=${DEPLOY_PATH} branch=${GIT_BRANCH} mode=${DEPLOY_MODE} composer_clean=${COMPOSER_CLEAN}"
            sudo -E env DEPLOY_PATH="${DEPLOY_PATH}" GIT_BRANCH="${GIT_BRANCH}" DEPLOY_MODE="${DEPLOY_MODE}" \
              COMPOSER_CLEAN="${COMPOSER_CLEAN}" RUN_MIGRATIONS="${RUN_MIGRATIONS}" DEPLOY_USE_SUDO=false \
              bash "${DEPLOY_PATH}/scripts/deploy.sh"

  tag:
    needs: deploy
    if: success()
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-tag.yml
    with:
      environment: prod

  # Avisa al agente de soporte qué tickets (INC-/CFG- en los commits, p. ej. merge de soporte/{codigo}) entraron en este deploy,
  # para que los pase a "desplegado". Opcional: si falta el secret, no hace nada.
  notificar-agente-soporte:
    needs: deploy
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Disparar agente con los tickets desplegados
        env:
          FIRE_URL: ${{ vars.SOPORTE_TI_AGENTE_FIRE_URL }}
          TOKEN: ${{ secrets.SOPORTE_TI_AGENTE_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ] || [ -z "${FIRE_URL}" ]; then
            echo "::warning title=Agente soporte::Falta vars.SOPORTE_TI_AGENTE_FIRE_URL ($([ -n "${FIRE_URL}" ] && echo ok || echo FALTA)) o secrets.SOPORTE_TI_AGENTE_TOKEN ($([ -n "${TOKEN}" ] && echo ok || echo FALTA)): no se avisó al agente."
            exit 0
          fi

          RANGE="${GITHUB_SHA}"
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${GITHUB_SHA}"
          fi
          CODIGOS="$(git log --format='%s' "${RANGE}" \
            | grep -oE '(INC|CFG)-[0-9]{2}-[0-9]{4}' | sort -u | paste -sd, - || true)"

          if [ -z "${CODIGOS}" ]; then
            echo "::notice title=Agente soporte::Ningún ticket INC-/CFG- en este deploy."
            exit 0
          fi

          echo "Tickets desplegados: ${CODIGOS}"
          jq -n --arg t "Deploy PROD OK repo=intranet_back sha=${GITHUB_SHA} tickets=${CODIGOS}" '{text: $t}' \
            | curl -sS -X POST "${FIRE_URL}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
                -H "anthropic-version: 2023-06-01" \
                -H "Content-Type: application/json" \
                -d @- -o /tmp/fire.json -w "%{http_code}" > /tmp/fire.code || true
          CODE="$(cat /tmp/fire.code 2>/dev/null || echo 000)"
          if [ "${CODE}" = "200" ]; then
            echo "::notice title=Agente soporte::Agente avisado (${CODIGOS}). Sesión: $(jq -r '.claude_code_session_url // "?"' /tmp/fire.json)"
          else
            echo "::error title=Agente soporte::El agente rechazó el aviso (HTTP ${CODE}) para ${CODIGOS}. Revisa el token."
            exit 1
          fi
