<!DOCTYPE html>
<html lang="zh">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Rotulado Consolidado</title>
    <style>
        @page {
            margin: 6mm 10mm;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'noto sans sc', 'DejaVu Sans', sans-serif;
            font-size: 10pt;
            color: #111111;
            line-height: 1.25;
        }

        table {
            border-collapse: collapse;
        }

        .page-wrap {
            width: 100%;
            page-break-inside: avoid;
        }

        .header-banner {
            width: 100%;
            margin: 0 0 4px 0;
        }

        .title-cell {
            font-size: 20pt;
            font-weight: bold;
            padding: 0 0 6px 0;
            vertical-align: middle;
        }

        .peru-cell {
            text-align: right;
            padding: 0 0 6px 0;
            vertical-align: middle;
        }

        .peru-box {
            border: 1px solid #D1D5DB;
            padding: 3px 8px 3px 4px;
        }

        .peru-box td {
            vertical-align: middle;
            padding: 0;
        }

        .peru-text {
            font-size: 13pt;
            font-weight: bold;
            padding-left: 6px;
        }

        .divider-row td {
            border-top: 2px solid #111111;
            padding: 0;
            line-height: 0;
            font-size: 0;
        }

        .data-row td {
            border-bottom: 1px solid #BFC5CE;
            padding: 5px 3px;
            vertical-align: middle;
        }

        .col-icon {
            width: 28px;
            text-align: center;
        }

        .col-label {
            width: 112px;
            font-weight: bold;
            font-size: 10pt;
        }

        .col-value {
            font-size: 10pt;
        }

        .item-cn {
            font-family: 'noto sans sc', sans-serif;
            font-size: 9.5pt;
        }

        .footer-table {
            width: 100%;
            margin-top: 10px;
            border: 2px solid #111111;
            page-break-inside: avoid;
        }

        .footer-table td {
            padding: 14px 10px;
            text-align: center;
            vertical-align: middle;
        }

        .footer-text {
            font-size: 22pt;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

</html>
