<!DOCTYPE html>
<html lang="zh">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Rotulado Consolidado</title>
    <style>
        @page {
            margin: 10mm 12mm;
        }

        @font-face {
            font-family: 'noto sans sc';
            font-style: normal;
            font-weight: normal;
            src: url('assets/fonts/NotoSansSC-Regular.otf') format('opentype');
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'noto sans sc', 'DejaVu Sans', sans-serif;
            font-size: 11pt;
            color: #111111;
            line-height: 1.35;
        }

        .label {
            width: 100%;
        }

        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
        }

        .header-table td {
            vertical-align: middle;
            padding: 0 0 8px 0;
        }

        .title {
            font-size: 22pt;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .peru-badge {
            display: inline-block;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 4px 10px 4px 6px;
            white-space: nowrap;
        }

        .peru-badge img {
            vertical-align: middle;
            margin-right: 6px;
        }

        .peru-badge span {
            font-size: 14pt;
            font-weight: bold;
            vertical-align: middle;
        }

        .header-line {
            border: 0;
            border-top: 2px solid #111111;
            margin: 0 0 0 0;
        }

        .rows-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .rows-table tr {
            border-bottom: 1px solid #BFC5CE;
        }

        .rows-table td {
            padding: 9px 4px;
            vertical-align: middle;
        }

        .col-icon {
            width: 34px;
            text-align: center;
        }

        .col-icon img {
            width: 22px;
            height: 22px;
            display: block;
            margin: 0 auto;
        }

        .col-label {
            width: 118px;
            font-weight: bold;
            font-size: 10.5pt;
            letter-spacing: 0.2px;
        }

        .col-value {
            font-size: 10.5pt;
            word-wrap: break-word;
        }

        .item-cn {
            font-size: 10pt;
        }

        .footer-wrap {
            margin-top: 14px;
        }

        .footer-box {
            border: 2px solid #111111;
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
        }

        .footer-inner {
            display: inline-block;
            white-space: nowrap;
        }

        .footer-inner img {
            width: 34px;
            height: 34px;
            vertical-align: middle;
            margin-right: 12px;
        }

        .footer-text {
            font-size: 24pt;
            font-weight: bold;
            vertical-align: middle;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
